[package]
name = "zapisnik"
version = "2.0.1"
description = "Zápisník – jednoduchý sešit na poznámky"
edition = "2021"

[lib]
name = "zapisnik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
