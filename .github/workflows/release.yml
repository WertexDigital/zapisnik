name: Vydání

# Spustí se po nahrání značky vX.Y.Z (viz scripts/release.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Závislosti a editor
        run: |
          npm ci
          npm run build:editor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zápisník ${{ github.ref_name }}'
          releaseBody: |
            **Mac:** stáhni `Zapisnik_…_universal.dmg`, otevři a přetáhni Zápisník do Aplikací.
            **Windows:** stáhni `Zapisnik_…_x64-setup.exe` a spusť.

            Už nainstalovaný Zápisník se aktualizuje sám – při spuštění nabídne novou verzi.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
