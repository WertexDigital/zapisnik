<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zápisník</title>
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="lib/hljs/light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="lib/hljs/dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<script src="lib/marked.min.js"></script>
<script src="lib/katex/katex.min.js"></script>
<script src="lib/hljs/highlight.min.js"></script>
<script src="lib/mermaid.min.js"></script>
</head>
<body data-mode="read">
<div id="app">
  <aside id="sidebar">
    <div class="sb-top" data-tauri-drag-region>
      <button class="ib" data-act="sidebar" title="Skrýt postranní panel"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    </div>
    <div class="sb-search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Hledat v poznámkách" spellcheck="false"></div>
    <div id="sb-list"></div>
    <div class="sb-foot">
      <button class="ib" data-act="newnote" title="Nová poznámka"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="ib" data-act="newfolder" title="Nová složka"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6M9 13h6"/></svg></button>
      <button class="ib" data-act="daily" title="Dnešní deník"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
      <span id="sb-count"></span>
      <button class="ib" data-act="settings" title="Nastavení"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </aside>
  <section id="main">
    <header id="topbar" data-tauri-drag-region>
      <button class="ib show-sidebar" data-act="sidebar" title="Zobrazit postranní panel"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <button class="ib" id="nav-back" data-act="back" title="Zpět"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ib" id="nav-fwd" data-act="fwd" title="Vpřed"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="tt" data-tauri-drag-region><div id="note-title" data-tauri-drag-region></div><div id="note-sub" data-tauri-drag-region></div></div>
      <div class="tb-spacer" data-tauri-drag-region></div>
      <div id="mode-seg"><button data-mode="read">Číst</button><button data-mode="edit">Psát</button></div>
      <button class="ib" id="btn-star" data-act="star" title="Oblíbené"></button>
      <button class="ib" data-act="quiz" title="Zkoušet z otázek"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></button>
      <button class="ib" data-act="quick" title="Rychle otevřít"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="ib" data-act="inspector" title="Obsah a odkazy"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
    </header>
    <div id="title-bar"><input id="title-input" spellcheck="false" placeholder="Název poznámky" title="Název souboru – změnou se poznámka přejmenuje a opraví se odkazy na ni"></div>
    <div id="update-bar"></div>
    <div id="content">
      <main id="doc" class="markdown"></main>
      <section id="editor-wrap">
        <div id="toolbar"></div>
        <div id="editor"></div>
      </section>
    </div>
  </section>
  <aside id="inspector"><div class="insp-top" data-tauri-drag-region></div><div id="insp-body"></div></aside>
</div>
<script src="core.js"></script>
<script src="shell.js"></script>
<script src="editor.bundle.js"></script>
<script src="app.js"></script>
<script src="selftest.js"></script>
</body>
</html>
